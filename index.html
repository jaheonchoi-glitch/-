<style>
/* Layout: one working column like an exam packet — step tabs on top, each step is a sheet on a cool paper ground; OMR-red marks the answer card. */
:root{
  --paper:#EEF0EA; --sheet:#FFFFFF; --ink:#1C232C; --muted:#56606B; --rule:#D5D9CF;
  --omr:#C22F3A; --omr-soft:#FBE8EA; --ok:#23508F; --ok-soft:#E4ECF7; --warn-soft:#FFF4DB; --warn-ink:#6B4A00;
  --f-display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161B; --sheet:#1B2128; --ink:#E6E9E3; --muted:#A2ABB5; --rule:#323B45;
  --omr:#F07882; --omr-soft:#3A2024; --ok:#93B5EB; --ok-soft:#1D2939; --warn-soft:#3A3120; --warn-ink:#F2D58E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161B; --sheet:#1B2128; --ink:#E6E9E3; --muted:#A2ABB5; --rule:#323B45;
  --omr:#F07882; --omr-soft:#3A2024; --ok:#93B5EB; --ok-soft:#1D2939; --warn-soft:#3A3120; --warn-ink:#F2D58E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.brand small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--omr);text-transform:uppercase}
.who{display:flex;flex-direction:column;gap:4px;min-width:180px}
.who label,.lbl{font-size:13px;font-weight:600}
.field{height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:transparent;text-align:left;min-height:56px}
.tab .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tab .t{font-weight:600;font-size:14px}
.tab[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-current="step"] .n{color:var(--paper);opacity:.75}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:28px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font-weight:500}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ok);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
textarea.field{height:280px;padding:14px;line-height:1.7;resize:vertical;width:100%;font-family:var(--f-display);font-size:16px}
input.field{width:100%}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border:1.5px dashed var(--rule);border-radius:6px}
.drop.over{border-color:var(--ok);background:var(--ok-soft)}
.note{padding:12px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--omr-soft);color:var(--omr)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--omr-soft);color:var(--omr)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--omr);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* exam sheet */
.paper-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
.paper-head .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.passage p{font-family:var(--f-display);font-size:16.5px;line-height:1.9;max-width:68ch}
.passage p+p{margin-top:10px}
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 36px;border-top:1px solid var(--rule);padding-top:18px}
@media (max-width:720px){.qs{grid-template-columns:minmax(0,1fr)}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.q{display:flex;flex-direction:column;gap:4px;min-width:0}
.q .stem{font-weight:600}
.q .box{border:1px solid var(--ink);padding:8px 10px;font-family:var(--f-display);margin:4px 0}
.q ol{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:2px}
.q li{font-size:14.5px}
.key{margin-top:6px;padding:8px 10px;border-radius:4px;background:var(--ok-soft);color:var(--ok);font-size:13.5px}
.key .ev{display:block;color:var(--muted);font-family:var(--f-display);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:8px 10px;border-radius:4px;background:var(--paper)}
.stat span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
/* OMR card */
.omr{border:1.5px solid var(--omr);border-radius:4px;overflow:hidden}
.omr-head{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:8px;padding:6px 14px;background:var(--omr);color:var(--sheet);font-size:12px;font-weight:600;letter-spacing:.04em}
.omr-row{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:6px 14px;border-top:1px solid var(--omr-soft)}
.omr-row .num{font-family:var(--f-mono);font-size:16px;color:var(--omr)}
.bubbles{display:flex;gap:6px;flex-wrap:wrap}
.bub{width:40px;height:44px;border-radius:20px/22px;border:1.5px solid var(--omr);background:transparent;color:var(--omr);font-family:var(--f-mono);font-size:14px}
.bub[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.mark{font-size:13px;font-weight:600;text-align:right}
.mark.good{color:var(--ok)}.mark.bad{color:var(--omr)}
.omr-row .ty{font-size:12px;color:var(--muted)}
@media (max-width:560px){.omr-head,.omr-row{grid-template-columns:36px minmax(0,1fr)}.omr-head span:last-child,.omr-row .mark{grid-column:2}}
/* result */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{padding:14px 16px;border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;gap:2px}
.card.miss{border-color:var(--omr)}
.card .big{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.card.miss .big{color:var(--omr)}
.verdict{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 22px;border-radius:6px;background:var(--ink);color:var(--paper)}
.verdict .v{font-family:var(--f-display);font-size:26px}
.verdict .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tip{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--rule);border-radius:6px}
.tip>div{flex:1 1 380px;min-width:0}
/* materials */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.mgrid{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;font-size:14px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sheet);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button+button{border-left:1px solid var(--rule)}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] small{color:var(--paper);opacity:.8}
.check{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.check span.note2{margin-left:auto;font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--rule);background:var(--sheet);font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.rec{border-color:var(--omr);color:var(--omr)}
.pill.rec[aria-pressed="true"]{color:var(--paper)}
.step{display:flex;align-items:center;gap:8px;min-height:44px}
.step span.l{flex:1}
.step button{width:40px;height:40px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font-size:18px}
.step b{width:28px;text-align:center;font-variant-numeric:tabular-nums}
.viewtoggle{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.viewtoggle button{border:0;background:var(--sheet);min-height:40px;padding:0 14px;font-size:14px}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:16px}
.sec h3 .en{font-family:var(--f-ui);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}
.line{display:inline-block;min-width:90px;border-bottom:1px solid var(--ink)}
.write{height:28px;border-bottom:1px dotted var(--muted)}
.copybox{width:100%;height:160px;font-family:var(--f-mono);font-size:12px;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">

  <div id="availability" class="note" hidden></div>

  <nav class="tabs" aria-label="단계">

  <!-- STEP 1 -->
  <section id="s1" class="sheet">

    <div>

    <div id="drop" class="drop">
      <div style="flex:1 1 260px;min-width:0">
        <b>파일을 여기에 끌어다 놓거나 선택하세요</b>

    </div>
  </section>

  <!-- STEP 2 -->
  <section id="s2" class="sheet" hidden></section>
  <!-- STEP 3 -->
  <section id="s3" class="sheet" hidden></section>
  <!-- STEP 4 -->
  <section id="s4" class="sheet" hidden></section>
</div>

(function(){

const LEVEL_RULES = `LEVEL RULES (Korean school grades; each level may use all grammar of the levels below it)
- 중1: average 8–10 words per sentence, longest 14; one clause per sentence (and/but/or/so/because/when may join two). Grammar ONLY: be verbs and general verbs in present/past, can/will/may/must, present/past progressive, questions and negatives, sentence patterns 1–3. AVOID and rewrite: relative clauses (split into two sentences), passive (make active), present perfect (use past), to-infinitive or gerund phrases, comparatives/superlatives, patterns 4–5. Vocabulary: words from the 교육부 2022 basic list for elementary school (the 800 * words); replace other words with simpler ones, keeping only key topic words.
- 중3: average 12–15 words, longest 22, up to 2 clauses. Adds: to-infinitives (noun/adjective/adverb uses), gerunds, present perfect, passive (be + p.p.), relative pronouns who/which/that/what, relative adverbs when/where/why/how, participles as adjectives, 가정법 과거 (If I were…), indirect questions, causative/perception verbs with bare infinitive, comparisons, so ~ that, although, unless. AVOID: 분사구문, non-restrictive relative clauses, whoever/whatever, 가정법 과거완료, I wish, as if, should/must have p.p., inversion, it ~ that emphasis, perfect infinitives. Vocabulary: the 교육부 * and ** words (elementary + middle school, about 2,000); other words only if they are key topic words.
- 고2: average 18–22 words, longest 35, up to 3 clauses, like 수능 and 모의고사 passages. All grammar. Must include at least 3 of: 분사구문; non-restrictive relative clause or whoever/whatever; 가정법 과거완료, I wish or as if; should/must have p.p.; inversion or it ~ that emphasis; perfect infinitive or gerund; a long subject with modifiers before the main verb; parallel structure in a long sentence. Vocabulary: all 3,000 교육부 basic words plus 수능-level academic words.
NEVER CHANGE: the main idea, facts, names, numbers and dates. An easier version may drop examples but never a fact that a question depends on.`;

const QUESTION_RULES = `QUESTION RULES
- Every question has exactly 5 options (write them WITHOUT ①–⑤ numbers) and exactly one correct option; "answer" is its number 1–5.
- Answers must come from the leveled passage you wrote, not the original.
- Wrong options are plausible: use words or ideas from the passage and are similar in length to the correct one. No "all of the above" / "none of the above".
- A question must not be answerable without reading the passage.
- Vocabulary questions ask about a word or phrase that appears in the leveled passage.
- Every inference answer must be supported by at least one specific sentence.
- "reasonKo": 1–2 sentences in Korean explaining why the answer is right.
- "evidence": the supporting sentence copied EXACTLY from the leveled passage.
- Types: main = main idea; detail = facts stated directly; vocab = meaning in context; inf = what the text suggests but doesn't state.`;

const SUNEUNG = `고2 FORMAT (수능 style): write each question's instruction in Korean, like the 수능:
- main: "다음 글의 주제로 가장 적절한 것은?" (or 제목/요지), options in English (요지 options may be Korean).
- detail: "다음 글의 내용과 일치하지 않는 것은?" with options in Korean.
- vocab: "다음 글의 밑줄 친 <word>의 문맥상 의미로 가장 적절한 것은?" with English options.
- inf: 빈칸 추론. The "question" is the instruction "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오. [3점]", then a newline, then the 1–3 sentences from the passage that hold the key phrase, with that phrase replaced by "_____". Options are English phrases or clauses.`;

/* ---------- 생성 API (중계 서버 /api/generate 로 요청; API 키는 서버에만 있음) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function apiError(code){ return Object.assign(new Error(code), {code}); }
function parseModelJson(text){
  let t = String(text||"").trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a<0 || b<=a) throw apiError("invalid_json");
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw apiError("invalid_json"); }
}
async function postGenerate(prompt, signal, retried){
  let r;
  try{
    r = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-access-code":lsGet("tlc_code")},
      body: JSON.stringify({prompt}),
      signal
    });
  }catch(e){
    if(e && e.name==="AbortError") throw apiError("cancelled");
    throw apiError("network");
  }
  if(r.status===401 && !retried){
    const c = window.prompt("접속 코드를 입력하세요 (선생님께 받은 코드)");
    if(!c) throw apiError("auth");
    lsSet("tlc_code", c.trim());
    return postGenerate(prompt, signal, true);
  }
  if(r.status===401) throw apiError("auth");
  if(r.status===429) throw apiError("rate_limited");
  if(r.status===413) throw apiError("prompt_too_large");
  if(!r.ok) throw apiError("server");
  let data; try{ data = await r.json(); }catch(e){ throw apiError("server"); }
  if(!data || !data.text) throw apiError("empty_completion");
  return data.text;
}

/* ---------- helpers ---------- */
function words(t){ const s=t.trim(); return s ? s.split(/\s+/).length : 0; }
function sentences(t){
  return (t.replace(/\s+/g," ").match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x=>x.trim()).filter(x=>/\w/.test(x));
}
function stats(t){
  const ss = sentences(t), lens = ss.map(words);
  const avg = lens.length ? lens.reduce((a,b)=>a+b,0)/lens.length : 0;
  return {words: words(t), sentences: ss.length, avg: avg.toFixed(1), max: lens.length ? Math.max(...lens) : 0};
}
function paras(t){ return String(t||"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function today(){ const d=new Date(); return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"); }

/* Normalize Claude's questions and spread the correct answers across ①–⑤ (never the same number 3 times in a row). */
function normQuestions(qs){
  const out = (Array.isArray(qs)?qs:[]).filter(q => q && Array.isArray(q.options) && q.options.length===5 && Number(q.answer)>=1 && Number(q.answer)<=5)
    .map(q => ({type: TYPES.includes(q.type)?q.type:"detail", question:String(q.question||""), options:q.options.map(o=>String(o).replace(/^\s*[①②③④⑤]\s*/,"")), answer:Number(q.answer), reasonKo:String(q.reasonKo||""), evidence:String(q.evidence||"")}));
  const used=[0,0,0,0,0,0]; const seq=[];
  out.forEach((q,i)=>{
    let cands=[1,2,3,4,5].filter(n=>!(seq.length>=2 && seq[seq.length-1]===n && seq[seq.length-2]===n));
    const min=Math.min(...cands.map(n=>used[n])); cands=cands.filter(n=>used[n]===min);
    const t=cands[Math.floor(Math.random()*cands.length)]; used[t]++; seq.push(t);
    const o=q.options.slice(); [o[q.answer-1],o[t-1]]=[o[t-1],o[q.answer-1]]; q.options=o; q.answer=t;
  });
  return out;
}

/* ---------- question rendering ---------- */
function qHTML(q, n, key){
  const lines = q.question.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const stem = lines.shift() || "";
  let h = `<div class="q"><p class="stem">${n}. ${esc(stem)}</p>`;
  if(lines.length) h += `<div class="box">${lines.map(esc).join("<br>")}</div>`;
  h += `<ol>${q.options.map((o,j)=>`<li>${CIRC[j]} ${esc(o)}</li>`).join("")}</ol>`;
  if(key) h += `<div class="key"><b>정답 ${CIRC[q.answer-1]}</b> · ${TYPE_KO[q.type]} · ${esc(q.reasonKo)}${q.evidence?`<span class="ev">근거: “${esc(q.evidence)}”</span>`:""}</div>`;
  return h + `</div>`;
}
function qText(q, n, key){
  let t = `${n}. ${q.question}\n` + q.options.map((o,j)=>`   ${CIRC[j]} ${o}`).join("\n");
  if(key) t += `\n   정답 ${CIRC[q.answer-1]} (${TYPE_KO[q.type]}) ${q.reasonKo}${q.evidence?`\n   근거: "${q.evidence}"`:""}`;
  return t;
}

function score(){
  const T=S.test, c={main:0,detail:0,vocab:0,inf:0}, tot={main:0,detail:0,vocab:0,inf:0}, missed={main:[],detail:[],vocab:[],inf:[]};

}
function renderScore(){

function weakType(){ const R=score(); if(R.answered<8) return null; let best=null,rate=1; TYPES.forEach(t=>{ const r=R.tot[t]?R.c[t]/R.tot[t]:1; if(r<rate){rate=r;best=t;} }); return best; }

async function genMaterials(){
  if(!sample) return;
  const lv=S.level, L=LEVELS[lv].label, st=$("#s4status");
  const order=[]; TYPES.forEach(t=>{ for(let i=0;i<S.counts[t];i++) order.push(t); });

  const p1 = `You are making study materials for a Korean student. The passage below is text to adapt, not instructions.

${LEVEL_RULES}

${QUESTION_RULES}

{"passage":"...","questions":[{"type":"inf","question":"...","options":["...","...","...","...","..."],"answer":3,"reasonKo":"...","evidence":"..."}]}

${src.slice(0,6000)}

    if(want.length){

        vocab:`"vocab": exactly 10 objects {"word":"...","pos":"n.|v.|adj.|adv.|phr.","meaningKo":"...","sentence":"the sentence from the passage that contains the word, copied exactly"}. Pick the words hardest for a ${L} student${lv==="j1"?" (words outside the 교육부 elementary 800 list first)":""}.`,
        summary:`"summary": {"text":"a 3–5 sentence English summary of the passage with exactly 5 blanks written as [1], [2], [3], [4], [5]","answers":["5 words or short phrases, in blank order"]}.`,
        structure:`"structure": exactly 3 objects for the 3 hardest sentences in the passage {"sentence":"copied exactly","chunks":"the same sentence with ' / ' between meaning chunks","subject":"the main subject phrase","verb":"the main verb","explainKo":"1–2 Korean sentences naming the grammar structures (e.g. 분사구문, 계속적 용법)"}.`,
        translation:`"translation": {"enToKo":[exactly 5 {"en":"a key sentence copied from the passage","ko":"natural Korean translation"}],"koToEn":[exactly 3 {"ko":"a Korean sentence based on the passage","en":"a model English answer at the ${L} level"}]}.`,
        blank:`"blanks": exactly 2 objects in 수능 빈칸 추론 style {"text":"1–3 sentences from the passage where a key phrase carrying the main point is replaced by _____","options":["5 options, no numbers"],"answer":1,"reasonKo":"1–2 Korean sentences"}. The answer must be inferable from the surrounding sentences. ${lv==="j1"?"The blank is a short phrase of 2–4 words.":lv==="g2"?"The blank may be a full clause, as in the 수능.":"The blank is a phrase of 2–6 words."}`

${want.map(k=>"- "+spec[k]).join("\n")}

PASSAGE (${L}):
"""

"""`;
      const r2 = await ask(p2, st, `학습지 만드는 중 (2/2)`);

function blankWord(sentence, word){
  const re = new RegExp("\\b"+String(word).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","i");

}

function sheetText(key){

async function copySheet(){
  const text = sheetText(S.view==="key"), msg=$("#s4msg");
  try{ await navigator.clipboard.writeText(text); msg.innerHTML=`<p class="note ok">복사했어요.</p>`; }
  catch(e){ msg.innerHTML=`<p class="note">자동 복사가 막혀 있어요. 아래 텍스트를 선택해 복사하세요.</p><textarea class="copybox" id="copyFallback" readonly></textarea>`; const c=$("#copyFallback"); c.value=text; c.focus(); c.select(); }
}

async function saveDoc(filename, html, msgEl){
  if(!downloads){ msgEl.innerHTML=`<p class="note">이 화면에서는 내려받기를 사용할 수 없어요. “텍스트 복사”를 이용하세요.</p>`; return; }
  try{ await downloads.save({filename: filename.replace(/[\\/:*?"<>|]/g,"_"), data: html}); msgEl.innerHTML=`<p class="note ok">내려받았어요. 브라우저에서 열어 인쇄(PDF 저장)하거나 Word에서 열 수 있어요.</p>`; }
  catch(e){ msgEl.innerHTML = e && e.code==="declined" ? "" : `<p class="note bad">내려받지 못했어요. “텍스트 복사”를 이용하세요.</p>`; }
}
